name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML from Marp and prepare output
        run: |
          # 1. 公開用フォルダ _site を作成し既存ファイルを同期
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.git' --exclude='.github' . _site/

          # 2. slide_template.md を自動検索して同階層に HTML 化
          TARGET=$(find _site -name "slide_template.md" | head -n 1)
          if [ -z "$TARGET" ]; then
            echo "エラー: slide_template.md が見つかりません。"
            exit 1
          fi
          npx @marp-team/marp-cli@latest --html "$TARGET"

          # 3. Jekyll無効化ファイルを配置
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
