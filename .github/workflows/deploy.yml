name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main ] # mainブランチに変更がプッシュされたら実行

# GitHub Pagesへのデプロイに必要な権限設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML from Marp
        run: |
          # リポジトリ内の全 .md ファイルを階層構造を維持したまま build/ へ一括変換
          npx @marp-team/marp-cli@latest --input-dir . --output build --html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build # 公開するファイルが入っているフォルダを指定

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
