name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML from Marp and prepare output
        run: |
          # 1. 出力用ディレクトリ _site を作成
          mkdir -p _site

          # 2. 既存の全ファイル（他の.html等）を _site へ同期（自身や.gitを除外）
          rsync -av --exclude='_site' --exclude='.git' --exclude='.github' . _site/

          # 3. slide_template.md だけを _site/file/slide_template.html にビルド出力
          npx @marp-team/marp-cli@latest file/slide_template.md --html -o _site/file/slide_template.html

          # 4. Jekyll 処理無効化ファイルを配置
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
