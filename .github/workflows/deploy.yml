name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build HTML and prepare output
        run: |
          # 1. 公開用フォルダ _site を作成し全ファイルを複製
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.git' --exclude='.github' . _site/

          # 2. .md ファイルごとに処理を自動判定して変換
          find _site -name "*.md" | while read -r md_file; do
            html_file="${md_file%.md}.html"
            
            # marp: true の記述がある、またはファイル名に slide が含まれる場合は Marp 化
            if grep -q "marp: true" "$md_file" || [[ "$md_file" == *"slide"* ]]; then
              npx @marp-team/marp-cli@latest "$md_file" --html -o "$html_file"
            else
              # 通常のテキスト Markdown は pandoc で標準 HTML ページに変換
              pandoc "$md_file" -s \
                --metadata pagetitle="$(basename "$md_file" .md)" \
                -c "https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css" \
                -V body-class="markdown-body" \
                -o "$html_file"
            fi
          done

          # 3. Jekyll無効化ファイルを配置
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
