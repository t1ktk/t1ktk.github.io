name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML from Marp and prepare output
        run: |
          # 1. 公開用フォルダ _site を作成し、全ファイル（既存.htmlや画像など）を複製
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.git' --exclude='.github' . _site/

          # 2. _site 内のすべての .md ファイル（テキスト用・Marp用問わず）を一括 HTML 化
          npx @marp-team/marp-cli@latest --input-dir _site --output _site --html

          # 3. Jekyll無効化ファイルを配置
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

