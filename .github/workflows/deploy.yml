　name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML and prepare output
        run: |
          # 1. 公開用フォルダ _site を作成し全ファイルを複製
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.git' --exclude='.github' . _site/

          # 2. 標準搭載の Node.js で追加インストール不要で一括変換
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          function getFiles(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(dirent => {
              const res = path.resolve(dir, dirent.name);
              return dirent.isDirectory() ? getFiles(res) : res;
            });
          }

          const files = getFiles("_site").filter(f => f.endsWith(".md"));
          
          files.forEach(file => {
            const content = fs.readFileSync(file, "utf8");
            const htmlPath = file.replace(/\.md$/, ".html");

            if (content.includes("marp: true") || path.basename(file).toLowerCase().includes("slide")) {
              // Marp スライド化
              execSync(`npx @marp-team/marp-cli@latest "${file}" --html -o "${htmlPath}"`);
            } else {
              // 通常の文章 MD は npx -y marked で即座に HTML 化
              const body = execSync(`npx -y marked "${file}"`).toString();
              const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css"><style>.markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; } @media (max-width: 767px) { .markdown-body { padding: 15px; } }</style></head><body class="markdown-body">${body}</body></html>`;
              fs.writeFileSync(htmlPath, html);
            }
          });
          '

          # 3. Jekyll無効化ファイルを配置
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
