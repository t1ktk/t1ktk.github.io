name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML and prepare output
        run: |
          # 1. 公開用フォルダ _site を作成し全ファイルを複製
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.git' --exclude='.github' . _site/

          # 2. 通常の.md と Marp用.md を判定して一括変換
          find _site -name "*.md" | while read -r md_file; do
            html_file="${md_file%.md}.html"
            
            if grep -q "marp: true" "$md_file" || [[ "$md_file" == *"slide"* ]]; then
              # Marp スライド化
              npx @marp-team/marp-cli@latest "$md_file" --html -o "$html_file"
            else
              # 通常テキスト MD の HTML 化
              npx -y marked "$md_file" > "$html_file"
            fi
          done

          # 3. Jekyll無効化ファイルを配置
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
